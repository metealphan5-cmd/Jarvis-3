<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <script src="https://js.puter.com/v2/"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #02080c;
      color: #00eaff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 55px;
      letter-spacing: 10px;
      text-shadow: 0 0 20px #00eaff;
    }

    #durum {
      margin: 30px auto;
      width: 80%;
      min-height: 30px;
      font-size: 20px;
    }

    button {
      display: block;
      width: 280px;
      margin: 20px auto;
      padding: 18px;
      border: 2px solid #00eaff;
      border-radius: 12px;
      background: transparent;
      color: #00eaff;
      font-size: 19px;
      cursor: pointer;
      box-shadow: 0 0 15px #00eaff;
    }

    button:hover {
      background: #00eaff;
      color: #02080c;
    }
  </style>
</head>

<body>

  <h1>JARVIS</h1>

  <div id="durum">Sistem hazır.</div>

  <button id="konusButonu">JARVIS KONUŞ</button>
  <button id="dinleButonu">BENİ DİNLE</button>

  <script>
    const durum = document.getElementById("durum");
    const konusButonu = document.getElementById("konusButonu");
    const dinleButonu = document.getElementById("dinleButonu");

    function konus(metin) {
      durum.textContent = metin;

      const ses = new SpeechSynthesisUtterance(metin);

      ses.lang = "tr-TR";
      ses.rate = 0.9;
      ses.pitch = 0.75;
      ses.volume = 1;

      speechSynthesis.cancel();
      speechSynthesis.speak(ses);
    }

    konusButonu.addEventListener("click", function () {
      konus("Merhaba. Ben JARVIS. Sistemlerim hazır.");
    });

    dinleButonu.addEventListener("click", function () {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        durum.textContent =
          "Bu tarayıcı sesli komut özelliğini desteklemiyor.";
        return;
      }

      const tanima = new SpeechRecognition();

      tanima.lang = "tr-TR";
      tanima.continuous = false;
      tanima.interimResults = false;

      durum.textContent = "Seni dinliyorum...";

      tanima.start();

      tanima.onresult = async function (event) {

        const soru = event.results[0][0].transcript;

        durum.textContent = "JARVIS düşünüyor...";

        try {

          const cevap = await puter.ai.chat(soru, {
            model: "gpt-5.6-luna"
          });

          let metin = "";

          if (typeof cevap === "string") {
            metin = cevap;
          } else if (cevap?.message?.content) {
            metin = cevap.message.content;
          } else if (cevap?.text) {
            metin = cevap.text;
          } else {
            metin = "Cevap alınamadı.";
          }

          durum.textContent = metin;

          const ses = new SpeechSynthesisUtterance(metin);
          ses.lang = "tr-TR";
          ses.rate = 0.9;
          ses.pitch = 0.75;
          ses.volume = 1;

          speechSynthesis.cancel();
          speechSynthesis.speak(ses);

        } catch (hata) {

          console.error(hata);

          durum.textContent =
            "Yapay zekâya bağlanırken bir hata oluştu.";

          konus("Üzgünüm. Yapay zekâya bağlanırken bir hata oluştu.");
        }
      };

      tanima.onerror = function (event) {
        durum.textContent =
          "Mikrofon hatası: " + event.error;
      };
    });
  </script>

</body>
</html>
